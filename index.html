<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #ffede3;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: monospace;
    overflow-x: hidden;
}

.container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 10px;
}

.scene {
    position: relative;
    width: min(581px, 96vw);
}

.cake {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
    animation: cakeFloat 4s ease-in-out infinite;
}

svg {
    shape-rendering: crispEdges;
}

/* PIXEL ANIMATIONS */

.flame {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: flame 0.35s steps(2) infinite alternate;
}

@keyframes flame {
    from { transform: scaleY(1) translateY(0); }
    to { transform: scaleY(1.12) translateY(-2px); }
}

@keyframes cakeFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}

.sparkle {
    animation: sparkle 1.5s steps(3) infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
}

@keyframes sparkle {
    from { opacity: .35; }
    to { opacity: 1; }
}

.flame.out {
    animation: extinguish .4s steps(4) forwards;
}

@keyframes extinguish {
    to {
        opacity: 0;
        transform: scale(0);
    }
}

/* BUTTON */

.blow-button {
    margin-top: 15px;
    padding: 13px 24px;
    background: #e8aaaa;
    border: 4px solid #704b3d;
    box-shadow: 5px 5px #704b3d;
    color: #704b3d;
    font: 14px monospace;
    cursor: pointer;
}

.blow-button:hover {
    background: #f2bcbc;
}

.message {
    margin-top: 24px;
    color: #ce7488;
    font-size: 19px;
    font-weight: bold;
    line-height: 1.8;
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    transition: .7s;
}

.message.show {
    opacity: 1;
    transform: translateY(0);
}

@media(max-width:480px) {
    .message { font-size: 16px; }
}

@media(prefers-reduced-motion:reduce) {
    .cake, .flame, .sparkle {
        animation: none;
    }
}
</style>

<script>
const button = document.getElementById("blowButton");
const message = document.getElementById("message");
const flames = document.querySelectorAll(".flame");

let audioContext;
let microphone;
let analyser;
let audioData;
let animationFrame;
let blowStart = null;
let finished = false;

button.addEventListener("click", async () => {

    if (finished) return;

    button.disabled = true;
    button.textContent = "Requesting microphone...";

    try {
        microphone = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        audioContext = new AudioContext();

        if (audioContext.state === "suspended") {
            await audioContext.resume();
        }

        const source =
            audioContext.createMediaStreamSource(microphone);

        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;

        source.connect(analyser);

        audioData = new Uint8Array(analyser.fftSize);

        button.textContent = "🎤 Blow into your microphone!";

        detectBlow();

    } catch (error) {
        console.error(error);
        button.disabled = false;
        button.textContent = "Try microphone again";
        alert("Please allow microphone access.");
    }
});

function detectBlow() {

    if (finished) return;

    analyser.getByteTimeDomainData(audioData);

    let sum = 0;

    for (let i = 0; i < audioData.length; i++) {
        const sample = (audioData[i] - 128) / 128;
        sum += sample * sample;
    }

    const volume = Math.sqrt(sum / audioData.length);

    if (volume > 0.10) {

        if (blowStart === null) {
            blowStart = performance.now();
        }

        if (performance.now() - blowStart > 300) {
            extinguishCandles();
            return;
        }

    } else {
        blowStart = null;
    }

    animationFrame = requestAnimationFrame(detectBlow);
}

function extinguishCandles() {

    if (finished) return;

    finished = true;

    flames.forEach(flame => {
        flame.classList.add("out");
    });

    if (microphone) {
        microphone.getTracks().forEach(track => track.stop());
    }

    cancelAnimationFrame(animationFrame);

    if (audioContext && audioContext.state !== "closed") {
        audioContext.close();
    }

    // PLAY BIRTHDAY CELEBRATION SOUND
    const yaySound = document.getElementById("yaySound");

    yaySound.currentTime = 0;
    yaySound.play().catch(error => {
        console.log("Audio playback failed:", error);
    });

    button.textContent = "✨ Wish completed!";

    setTimeout(() => {
        message.classList.add("show");
    }, 700);
}
</script>
